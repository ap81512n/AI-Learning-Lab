[project]
name = "fde-learning-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ap81512n", email = "ami.phadnis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
fde-learning-lab = "fde_learning_lab:main"
fde-doc = "fde_learning_lab.document_cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
